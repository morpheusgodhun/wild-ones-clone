<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wild Ones - Mini Clone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 30% 20%, #2a76ff 0%, #0b1b3a 60%, #050a18 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    #game-container {
      width: min(1280px, 100vw);
      height: min(720px, 100vh);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.2);
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: rgba(255,255,255,.92);
      z-index: 999;
      pointer-events: none;
    }
    .loading-card{
      padding: 18px 22px;
      border-radius: 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(6px);
      min-width: 280px;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.22);
      border-top: 4px solid rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      width: 46px;
      height: 46px;
      animation: spin 1s linear infinite;
      margin: 14px auto 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .small { font-size: 13px; opacity: .8; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-card">
      <div style="font-weight: 800; font-size: 22px; letter-spacing: .2px;">Wild Ones (Mini Clone)</div>
      <div class="spinner"></div>
      <div class="small">Yükleniyor...</div>
    </div>
  </div>

  <div id="game-container"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
